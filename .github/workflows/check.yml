name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      # The plugin runs the compiled dist/ (Claude Code installs plugins without npm), so it must match src/.
      - run: npm run build
      - run: git diff --exit-code -- dist
        if: runner.os == 'Linux'
